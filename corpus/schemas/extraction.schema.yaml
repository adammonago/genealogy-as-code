$schema: https://json-schema.org/draft/2020-12/schema
$id: https://genealogy-as-code.local/hkf/schemas/extraction.schema.yaml
title: HKF Extraction
description: Representation produced from a source segment (OCR, HTR, transcription, etc.).
type: object
additionalProperties: true
required:
  - hkf_version
  - kind
  - id
  - segment_ref
  - method
  - generated
properties:
  hkf_version:
    type: string
    const: "0.1"
  kind:
    type: string
    const: Extraction
  id:
    type: string
    pattern: "^extraction:.+"
  segment_ref:
    type: string
    pattern: "^segment:.+"
  method:
    type: string
    minLength: 1
    description: >
      Recommended values include manual-transcription, ocr, htr,
      structured-import, model-extraction, hybrid. Unknown values MUST be tolerated.
  artifact:
    type: object
    additionalProperties: true
    properties:
      resource:
        type: string
      content_hash:
        type: string
  tool:
    type: object
    additionalProperties: true
    properties:
      actor:
        type: string
      model:
        type: string
      model_revision:
        type: string
  extraction_confidence:
    type: number
    minimum: 0
    maximum: 1
    description: >
      Describes extraction process quality only. MUST NOT be read as source
      credibility or OKF trust.
  generated:
    $ref: "#/$defs/generated"
  verified:
    $ref: "#/$defs/verified"
$defs:
  generated:
    type: object
    additionalProperties: true
    required: [by]
    properties:
      by: { type: string, minLength: 1 }
      at: { type: string }
  verified:
    type: array
    items:
      type: object
      additionalProperties: true
      required: [by]
      properties:
        by: { type: string, minLength: 1 }
        at: { type: string }
