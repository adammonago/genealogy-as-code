$schema: https://json-schema.org/draft/2020-12/schema
$id: https://genealogy-as-code.local/hkf/schemas/derivation-run.schema.yaml
title: HKF DerivationRun
description: Record of how derived data was produced (reproducibility and audit).
type: object
additionalProperties: true
required:
  - hkf_version
  - kind
  - id
  - pipeline_ref
  - run_state
  - started_at
  - inputs
  - outputs
  - generated
properties:
  hkf_version:
    type: string
    const: "0.1"
  kind:
    type: string
    const: DerivationRun
  id:
    type: string
    pattern: "^run:.+"
  pipeline_ref:
    type: string
    minLength: 1
  run_state:
    type: string
    enum: [succeeded, partial, failed]
  started_at:
    type: string
  completed_at:
    type: string
  inputs:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/io_item"
  outputs:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/io_item"
  software:
    type: array
    items:
      type: object
      additionalProperties: true
      required: [actor]
      properties:
        actor: { type: string }
        revision: { type: string }
  parameters:
    type: object
    additionalProperties: true
  generated:
    type: object
    additionalProperties: true
    required: [by]
    properties:
      by: { type: string, minLength: 1 }
      at: { type: string }
$defs:
  io_item:
    type: object
    additionalProperties: true
    required: [role]
    properties:
      role: { type: string, minLength: 1 }
      resource: { type: string }
      content_hash: { type: string }
